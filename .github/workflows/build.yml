name: Build and GameTests
on:
  push:
    branches: [port/26.3]
  pull_request:
    branches: [port/26.3, port/26.2]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew clean build -PgameTests -PacceptMinecraftEula=true runGameTest runResetIntegration --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardcoreworldreset-26.3
          path: |
            build/libs/*.jar
            build/reports/
            build/run/gameTest/logs/
            build/run/resetIntegration/logs/
