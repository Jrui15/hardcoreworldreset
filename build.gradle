plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
}

// Opt-in integration tests use a disposable world under build/run/gameTest.
if (project.hasProperty('gameTests')) {
	fabricApi {
		configureTests {
			createSourceSet = true
			modId = 'hardcoreworldreset-test'
			enableGameTests = true
			enableClientGameTests = false
			eula = project.findProperty('acceptMinecraftEula') == 'true'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "projectName", project.name
	from("LICENSE") {
		rename { "${it}_${project.name}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}

// Full destructive lifecycle checks are confined to a fresh disposable test world.
if (project.hasProperty('gameTests')) {
    loom.runs {
        resetIntegration {
            server()
            source sourceSets.gametest
            runDir 'build/run/resetIntegration'
            vmArg '-Dhwr.integration=true'
        }
    }
    tasks.named('runResetIntegration') {
        doFirst {
            if (project.findProperty('acceptMinecraftEula') != 'true') {
                throw new GradleException('Pass -PacceptMinecraftEula=true after accepting the Minecraft EULA')
            }
            def directory = layout.buildDirectory.dir('run/resetIntegration').get().asFile
            delete directory
            directory.mkdirs()
            new File(directory, 'eula.txt').text = 'eula=true\n'
            new File(directory, 'server.properties').text = 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=25576\nview-distance=2\nsimulation-distance=2\n'
        }
        doLast {
            if (!layout.buildDirectory.file('run/resetIntegration/hwr-integration-passed').get().asFile.exists()) {
                throw new GradleException('Reset integration suite did not complete successfully; inspect the server log')
            }
        }
    }
}
